services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - api
    image: my-todos-web:latest
    container_name: my-todos-web
    networks:
      - public
      - private
    ports:
      - "8080:80"

  mongo:
    image: mongo:7
    container_name: my-todos-mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    networks:
      - public
      - private
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: my-todos-redis
    restart: unless-stopped
    networks:
      - private
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
    image: my-todos-api:latest
    container_name: my-todos-api
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongo:27017/todos
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: todo-images
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-todos}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-todos-minio}
      S3_PUBLIC_URL: /storage
    volumes:
      - ./backend/src:/app/src
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - private

  worker:
    build:
      context: ./backend
    image: my-todos-api:latest
    container_name: my-todos-worker
    restart: unless-stopped
    command: ["pnpm", "run", "dev:worker"]
    environment:
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: todo-images
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-todos}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-todos-minio}
      S3_PUBLIC_URL: /storage
    volumes:
      - ./backend/src:/app/src
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - private

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: my-todos-minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-todos}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-todos-minio}
    networks:
      - private
    volumes:
      - minio_data:/data

  mongo-express:
    image: mongo-express:1
    container_name: my-todos-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
      ME_CONFIG_BASICAUTH: "false"
    networks:
      - public
      - private
    depends_on:
      mongo:
        condition: service_healthy

networks:
  public:
  private:
    internal: true

volumes:
  mongo_data:
  minio_data:
